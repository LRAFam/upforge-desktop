name: Packaged self-test

# Builds an unpacked Windows app (electron-builder --dir: no installer, no signing, no publish)
# and runs its built-in self-test, so packaging bugs (worker chunk inside app.asar, demoparser2
# native addon in app.asar.unpacked) fail here instead of on players' PCs.
# Self-test mode: electron/main/selftest.ts (needs UPFORGE_SELFTEST=1 AND --selftest=<name>).
# release.yml calls this workflow and builds installers only after it passes.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'electron/main/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - '.github/workflows/packaged-selftest.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  demo-worker-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package unpacked app (no installer, no signing)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --dir --publish never

      - name: Check packaged layout
        shell: pwsh
        run: |
          $res = "dist\win-unpacked\resources"
          $node = Get-ChildItem "$res\app.asar.unpacked\node_modules\@laihoe" -Recurse -Filter "*.node" -ErrorAction SilentlyContinue
          if (-not $node) { throw "demoparser2 native addon is not in app.asar.unpacked (check asarUnpack in package.json)" }
          $node | ForEach-Object { Write-Host "native addon: $($_.FullName.Substring($res.Length + 1))" }

      - name: Run demo-worker self-test in the packaged app
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\win-unpacked\UpForge.exe"
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $stdout = Join-Path $env:RUNNER_TEMP "selftest-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "selftest-stderr.txt"
          $env:UPFORGE_SELFTEST = "1"
          $env:UPFORGE_SELFTEST_OUT = $out
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest=demo-worker" -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $null = $p.Handle  # keeps ExitCode readable after exit
          # A main-process crash at import shows a modal dialog and never exits: treat as failure.
          $exited = $p.WaitForExit(180000)
          if (-not $exited) {
            Get-Process -Name "UpForge*" -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          Write-Host "--- stdout"; Get-Content $stdout -ErrorAction SilentlyContinue
          Write-Host "--- stderr (tail)"; Get-Content $stderr -Tail 40 -ErrorAction SilentlyContinue
          if (-not $exited) { throw "Self-test timed out (likely a main-process error dialog at startup)" }
          if (-not (Test-Path $out)) { throw "Self-test wrote no result (exit code $($p.ExitCode))" }
          $result = Get-Content $out -Raw | ConvertFrom-Json
          Write-Host "--- result"; $result | Format-List | Out-String | Write-Host
          if ($p.ExitCode -ne 0 -or -not $result.ok -or -not $result.packaged) {
            throw "Self-test failed (exit $($p.ExitCode)): $($result.error)"
          }
