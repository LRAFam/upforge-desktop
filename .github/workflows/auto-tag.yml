name: Auto Tag Release

# Runs only after the CI workflow (ci.yml: type-check + unit tests on Linux and
# Windows) finishes SUCCESSFULLY for a push to main. A red build never gets tagged,
# so it can never auto-update to users.
# Reads package.json version at the CI-tested commit — if that tag doesn't exist
# yet, creates it on that exact commit and dispatches the Build Installers workflow.
# Workflow: bump version in package.json → push → CI green → tag auto-created → release builds.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main

jobs:
  auto-tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}  # the commit CI tested, not latest main
          fetch-depth: 0  # need full history to check existing tags

      - name: Read version from package.json
        id: pkg
        run: echo "version=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "${{ steps.pkg.outputs.version }}" | grep -q "${{ steps.pkg.outputs.version }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.pkg.outputs.version }}" "${{ github.event.workflow_run.head_sha }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "${{ steps.pkg.outputs.version }}"
          echo "✅ Created tag ${{ steps.pkg.outputs.version }}"

      - name: Dispatch release build for new tag
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # This explicit dispatch is the only tag release trigger. release.yml does
          # not also listen for tag pushes, whether GH_TOKEN is a PAT or an App token.
          gh workflow run "release.yml" --ref "${{ steps.pkg.outputs.version }}"
          echo "🚀 Dispatched Build Installers for ${{ steps.pkg.outputs.version }}"

      - name: Skip (tag already exists)
        if: steps.tag_check.outputs.exists == 'true'
        run: echo "⏭️  Tag ${{ steps.pkg.outputs.version }} already exists — no new release needed"
